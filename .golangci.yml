version: "2"

run:
  timeout: 5m
  concurrency: 2

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - misspell
    - bodyclose
    - sqlclosecheck
    - nolintlint
  exclusions:
    generated: strict

formatters:
  enable:
    - gofumpt
    - goimports
